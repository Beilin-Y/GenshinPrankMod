name: Java CI

on:
  push:
    branches: [ 'safe-wrapper' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Download Gradle 8.6
      run: |
        curl -sSL -o gradle-8.6-bin.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip
        unzip -q gradle-8.6-bin.zip -d gradle
        export PATH="$GITHUB_WORKSPACE/gradle/gradle-8.6/bin:$PATH"
        echo "Gradle downloaded to $GITHUB_WORKSPACE/gradle/gradle-8.6"

    - name: Build with Gradle
      run: |
        export PATH="$GITHUB_WORKSPACE/gradle/gradle-8.6/bin:$PATH"
        gradle build --no-daemon --no-parallel

    - name: Upload mod JAR
      uses: actions/upload-artifact@v4
      with:
        name: genshin-mod-jar
        path: build/libs/*.jar
