name: Java CI

on:
  push:
    branches: [ 'safe-wrapper' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Check for gradlew
      id: check-wrapper
      run: |
        if [ -f ./gradlew ]; then
          chmod +x ./gradlew || true
          echo "has_wrapper=true" >> $GITHUB_OUTPUT
        else
          echo "has_wrapper=false" >> $GITHUB_OUTPUT
        fi

    - name: Build with Gradle using wrapper
      if: steps.check-wrapper.outputs.has_wrapper == 'true'
      uses: gradle/gradle-build-action@v2
      with:
        arguments: clean build --no-daemon --no-parallel --stacktrace --info

    - name: Build with Gradle (installing Gradle)
      if: steps.check-wrapper.outputs.has_wrapper == 'false'
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '7.6'
        arguments: clean build --no-daemon --no-parallel --stacktrace --info

    - name: Upload mod JAR
      uses: actions/upload-artifact@v4
      with:
        name: genshin-mod-jar
        path: build/libs/*.jar
